<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>DARK WEB PLAYER</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  :root {
    --primary: #e50914;
    --primary-dark: #b20710;
    --primary-light: #f40612;
    --bg-dark: #141414;
    --bg-darker: #0a0a0a;
    --bg-light: #1f1f1f;
    --bg-sidebar: #0a0a0a;
    --text-primary: #ffffff;
    --text-secondary: #b3b3b3;
    --accent: #e50914;
    --success: #46d369;
    --error: #e87c03;
    --border: rgba(255, 255, 255, 0.1);
  }
  
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
  }
  
  body {
    background-color: var(--bg-dark);
    color: var(--text-primary);
    overflow-x: hidden;
    line-height: 1.5;
    min-height: 100vh;
    display: flex;
  }
  
  .login-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 20px;
    background: linear-gradient(135deg, var(--bg-darker) 0%, var(--bg-dark) 100%);
    text-align: center;
    width: 100%;
  }
  
  .login-box {
    background: var(--bg-light);
    border-radius: 10px;
    padding: 30px;
    width: 100%;
    max-width: 500px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    border: 1px solid var(--border);
  }
  
  .login-title {
    font-size: 2.2rem;
    margin-bottom: 10px;
    color: var(--text-primary);
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 2px;
  }
  
  .login-subtitle {
    font-size: 1rem;
    color: var(--text-secondary);
    margin-bottom: 30px;
  }
  
  .login-form {
    display: flex;
    flex-direction: column;
    gap: 20px;
  }
  
  .form-group {
    display: flex;
    flex-direction: column;
    gap: 8px;
    text-align: left;
  }
  
  .form-control {
    padding: 12px 15px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: rgba(255, 255, 255, 0.05);
    color: var(--text-primary);
    font-size: 1rem;
    transition: all 0.2s ease;
  }
  
  .form-control:focus {
    outline: none;
    border-color: var(--primary);
    background: rgba(255, 255, 255, 0.1);
  }
  
  .login-btn {
    padding: 12px;
    background: var(--primary);
    color: white;
    border: none;
    border-radius: 6px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s ease;
    margin-top: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    min-height: 48px;
  }
  
  .login-btn:hover {
    background: var(--primary-dark);
    transform: translateY(-2px);
  }
  
  .login-btn:disabled {
    opacity: 0.7;
    cursor: not-allowed;
    transform: none;
  }
  
  .login-footer {
    margin-top: 20px;
    font-size: 0.9rem;
    color: var(--text-secondary);
  }
  
  .login-error {
    color: var(--error);
    margin-top: 10px;
    font-size: 0.9rem;
    display: none;
  }
  
  .divider {
    display: flex;
    align-items: center;
    text-align: center;
    color: var(--text-secondary);
    margin: 15px 0;
  }
  .divider::before, .divider::after {
    content: '';
    flex: 1;
    border-bottom: 1px solid var(--border);
  }
  .divider::before { margin-right: 10px; }
  .divider::after { margin-left: 10px; }
  
  .sidebar {
    width: 220px;
    background-color: var(--bg-sidebar);
    height: 100vh;
    position: fixed;
    left: 0;
    top: 0;
    padding: 20px 0;
    display: flex;
    flex-direction: column;
    border-right: 1px solid var(--border);
    z-index: 100;
    overflow-y: auto;
  }
  
  .logo {
    padding: 25px 20px 30px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 20px;
  }
  
  .logo-text {
    font-size: 1.5rem;
    font-weight: bold;
    color: var(--primary);
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  
  .user-info {
    padding: 0 20px;
    margin-bottom: 30px;
    display: flex;
    flex-direction: column;
    gap: 5px;
  }
  
  .user-name {
    font-size: 1.1rem;
    font-weight: 600;
  }
  
  .user-status {
    font-size: 0.8rem;
    color: var(--success);
    display: flex;
    align-items: center;
    gap: 5px;
  }
  
  .status-indicator {
    width: 8px;
    height: 8px;
    background-color: var(--success);
    border-radius: 50%;
    display: inline-block;
  }
  
  .user-expiry {
    font-size: 0.8rem;
    color: var(--text-secondary);
  }
  
  .sidebar-menu {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 5px;
    overflow-y: auto;
  }
  
  .menu-item {
    padding: 12px 20px;
    display: flex;
    align-items: center;
    gap: 15px;
    cursor: pointer;
    transition: all 0.2s ease;
    color: var(--text-secondary);
    white-space: nowrap;
  }
  
  .menu-item:hover, .menu-item.active {
    background-color: rgba(229, 9, 20, 0.2);
    color: var(--text-primary);
  }
  
  .menu-item.active {
    border-left: 3px solid var(--primary);
  }
  
  .menu-icon {
    width: 20px;
    height: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  
  .main-content {
    margin-left: 220px;
    flex: 1;
    padding: 30px;
    min-height: 100vh;
    overflow-x: hidden;
  }
  
  .featured-container {
    position: relative;
    height: 500px;
    border-radius: 10px;
    overflow: hidden;
    margin-bottom: 40px;
  }
  
  .featured-backdrop {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    filter: brightness(0.4);
    z-index: 1;
  }
  
  .featured-content {
    position: relative;
    z-index: 2;
    padding: 50px;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0) 100%);
  }
  
  .featured-title {
    font-size: 3.5rem;
    font-weight: bold;
    margin-bottom: 15px;
    max-width: 70%;
  }
  
  .featured-info {
    display: flex;
    gap: 20px;
    margin-bottom: 20px;
    align-items: center;
    flex-wrap: wrap;
  }
  
  .featured-genre {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }
  
  .genre-tag {
    background-color: rgba(255, 255, 255, 0.1);
    padding: 3px 10px;
    border-radius: 4px;
    font-size: 0.9rem;
  }
  
  .featured-actions {
    display: flex;
    gap: 15px;
    flex-wrap: wrap;
  }
  
  .play-btn {
    background-color: var(--primary);
    color: white;
    border: none;
    padding: 10px 25px;
    border-radius: 5px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
    transition: all 0.2s ease;
  }
  
  .play-btn:hover {
    background-color: var(--primary-dark);
  }
  
  .more-info-btn {
    background-color: rgba(255, 255, 255, 0.2);
    color: white;
    border: 1px solid rgba(255, 255, 255, 0.5);
    padding: 10px 25px;
    border-radius: 5px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
    transition: all 0.2s ease;
  }
  
  .more-info-btn:hover {
    background-color: rgba(255, 255, 255, 0.3);
  }
  
  .section {
    margin-bottom: 40px;
  }
  
  .section-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
    flex-wrap: wrap;
    gap: 10px;
  }
  
  .section-title {
    font-size: 1.8rem;
    font-weight: bold;
  }
  
  .section-link {
    color: var(--text-secondary);
    text-decoration: none;
    font-size: 0.9rem;
    display: flex;
    align-items: center;
    gap: 5px;
    transition: color 0.2s ease;
    cursor: pointer;
  }
  
  .section-link:hover {
    color: var(--text-primary);
  }
  
  .content-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 20px;
  }
  
  .content-card {
    background-color: var(--bg-light);
    border-radius: 5px;
    overflow: hidden;
    transition: all 0.2s ease;
    cursor: pointer;
    border: 1px solid var(--border);
  }
  
  .content-card:hover {
    transform: scale(1.03);
    box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
    border-color: var(--primary);
  }
  
  .content-poster-container {
    position: relative;
  }
  
  .content-poster {
    width: 100%;
    height: 300px;
    object-fit: cover;
    display: block;
  }
  
  .content-info {
    padding: 15px;
  }
  
  .content-title {
    font-weight: 600;
    margin-bottom: 5px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  
  .content-meta {
    display: flex;
    justify-content: space-between;
    font-size: 0.8rem;
    color: var(--text-secondary);
  }
  
  .favorite-btn {
    position: absolute;
    top: 10px;
    right: 10px;
    background: rgba(0, 0, 0, 0.7);
    border: none;
    border-radius: 50%;
    width: 36px;
    height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.2s ease;
    z-index: 2;
  }
  
  .favorite-btn:hover {
    background: rgba(0, 0, 0, 0.9);
    transform: scale(1.1);
  }
  
  .player-container {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: var(--bg-darker);
    z-index: 1000;
    flex-direction: column;
    padding: 20px;
    overflow-y: auto;
  }
  
  .player-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
  }
  
  .player-title {
    font-size: 1.5rem;
    font-weight: bold;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 70%;
  }
  
  .player-close {
    background: none;
    border: none;
    color: var(--text-secondary);
    font-size: 1.5rem;
    cursor: pointer;
    flex-shrink: 0;
  }
  
  .player-close:hover {
    color: var(--text-primary);
  }
  
  video {
    width: 100%;
    max-height: 70vh;
    background: black;
    border-radius: 8px;
  }
  
  .player-info {
    display: flex;
    align-items: center;
    gap: 15px;
    margin-top: 15px;
    padding: 15px;
    background: var(--bg-light);
    border-radius: 8px;
    flex-wrap: wrap;
  }
  
  .player-poster {
    width: 100px;
    height: 150px;
    object-fit: cover;
    border-radius: 5px;
  }
  
  .player-details {
    flex: 1;
    min-width: 200px;
  }
  
  .player-content-title {
    font-size: 1.5rem;
    font-weight: bold;
    margin-bottom: 5px;
  }
  
  .player-meta {
    display: flex;
    gap: 15px;
    color: var(--text-secondary);
    font-size: 0.9rem;
    margin-bottom: 10px;
    flex-wrap: wrap;
  }
  
  .player-description {
    color: var(--text-secondary);
    font-size: 0.9rem;
    line-height: 1.4;
  }
  
  .player-controls {
    display: flex;
    gap: 10px;
    margin-top: 20px;
    flex-wrap: wrap;
  }
  
  .player-controls button {
    padding: 10px 20px;
    background: var(--primary);
    color: white;
    border: none;
    border-radius: 5px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
    transition: all 0.2s ease;
  }
  
  .player-controls button:hover {
    background: var(--primary-dark);
  }
  
  .player-episodes {
    margin-top: 20px;
    padding: 15px;
    background: var(--bg-light);
    border-radius: 8px;
  }
  
  .player-episodes-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 15px;
    flex-wrap: wrap;
    gap: 10px;
  }
  
  .player-episodes-header h3 {
    margin: 0;
    font-size: 1.2rem;
  }
  
  .player-episodes-list {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 10px;
    max-height: 250px;
    overflow-y: auto;
  }
  
  .player-episode-item {
    background: rgba(255, 255, 255, 0.05);
    border-radius: 5px;
    padding: 10px;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  
  .player-episode-item:hover {
    background: rgba(229, 9, 20, 0.2);
  }
  
  .player-episode-item.current {
    background: rgba(229, 9, 20, 0.4);
  }
  
  .player-episode-number {
    font-weight: 600;
    margin-bottom: 5px;
  }
  
  .player-episode-title {
    font-size: 0.9rem;
    color: var(--text-secondary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  
  .content-details-modal {
    display: none;
    position: fixed;
    z-index: 1001;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    overflow: auto;
    background-color: rgba(0, 0, 0, 0.9);
  }
  
  .modal-content {
    background-color: var(--bg-light);
    margin: 5% auto;
    padding: 20px;
    border: 1px solid var(--border);
    width: 90%;
    max-width: 800px;
    border-radius: 10px;
    position: relative;
  }
  
  .close-modal {
    position: absolute;
    right: 20px;
    top: 15px;
    color: var(--text-secondary);
    font-size: 28px;
    font-weight: bold;
    cursor: pointer;
    z-index: 10;
  }
  
  .close-modal:hover {
    color: var(--text-primary);
  }
  
  .modal-body {
    display: flex;
    gap: 20px;
  }
  
  .modal-poster {
    flex-shrink: 0;
  }
  
  .modal-poster img {
    width: 200px;
    height: 300px;
    object-fit: cover;
    border-radius: 5px;
  }
  
  .modal-info {
    flex: 1;
  }
  
  .modal-title {
    font-size: 1.8rem;
    font-weight: bold;
    margin-bottom: 10px;
  }
  
  .modal-meta {
    display: flex;
    gap: 15px;
    margin: 10px 0;
    flex-wrap: wrap;
  }
  
  .modal-genres {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }
  
  .modal-description {
    color: var(--text-secondary);
    font-size: 0.9rem;
    line-height: 1.4;
    margin: 15px 0;
  }
  
  .modal-actions {
    margin-top: 20px;
    display: flex;
    gap: 15px;
    flex-wrap: wrap;
  }
  
  .series-episodes-modal {
    display: none;
    position: fixed;
    z-index: 1002;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    overflow: auto;
    background-color: rgba(0, 0, 0, 0.9);
  }
  
  .series-modal-content {
    background-color: var(--bg-light);
    margin: 3% auto;
    padding: 20px;
    border: 1px solid var(--border);
    width: 90%;
    max-width: 1000px;
    border-radius: 10px;
    position: relative;
  }
  
  .seasons-container {
    margin-top: 20px;
  }
  
  .season-header {
    background: rgba(255, 255, 255, 0.05);
    border-radius: 5px;
    padding: 12px 15px;
    margin: 10px 0;
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    align-items: center;
    transition: background 0.2s ease;
  }
  
  .season-header:hover {
    background: rgba(255, 255, 255, 0.1);
  }
  
  .season-header h3 {
    margin: 0;
    font-size: 1.1rem;
  }
  
  .season-header i {
    transition: transform 0.3s ease;
  }
  
  .season-header.expanded i {
    transform: rotate(180deg);
  }
  
  .episodes-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 15px;
    margin-top: 15px;
    padding-left: 10px;
  }
  
  .episode-card {
    background: rgba(255, 255, 255, 0.05);
    border-radius: 8px;
    padding: 12px;
    cursor: pointer;
    transition: all 0.2s ease;
    text-align: center;
    border: 1px solid transparent;
  }
  
  .episode-card:hover {
    background: rgba(229, 9, 20, 0.2);
    transform: translateY(-3px);
    border-color: var(--primary);
  }
  
  .episode-number {
    font-weight: 600;
    margin-bottom: 5px;
    color: var(--primary);
  }
  
  .episode-title {
    font-size: 0.9rem;
    color: var(--text-secondary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  
  .modal {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: rgba(0, 0, 0, 0.8);
    z-index: 2000;
    align-items: center;
    justify-content: center;
  }
  
  .modal .modal-inner {
    background: var(--bg-light);
    border-radius: 8px;
    width: 90%;
    max-width: 400px;
    padding: 20px;
  }
  
  .modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 15px;
  }
  
  .modal-header h3 {
    font-size: 1.2rem;
    font-weight: bold;
    color: var(--text-primary);
    margin: 0;
  }
  
  .modal-close {
    background: none;
    border: none;
    color: var(--text-secondary);
    font-size: 1.5rem;
    cursor: pointer;
  }
  
  .quality-options {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  
  .quality-option {
    padding: 12px;
    background: rgba(255, 255, 255, 0.1);
    border-radius: 6px;
    cursor: pointer;
    transition: background 0.2s;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  
  .quality-option:hover {
    background: rgba(255, 255, 255, 0.2);
  }
  
  .quality-name {
    font-weight: 600;
  }
  
  .quality-resolution {
    color: var(--text-secondary);
    font-size: 0.8rem;
  }
  
  .category-selector {
    margin-bottom: 20px;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }
  
  .category-btn {
    padding: 8px 15px;
    background: rgba(255, 255, 255, 0.1);
    border: 1px solid var(--border);
    border-radius: 5px;
    color: var(--text-primary);
    cursor: pointer;
    transition: all 0.2s ease;
    font-size: 0.9rem;
  }
  
  .category-btn:hover {
    background: rgba(229, 9, 20, 0.2);
    border-color: var(--primary);
  }
  
  .category-btn.active {
    background: var(--primary);
    border-color: var(--primary);
  }
  
  #live-cat-select {
    background-color: #f0f0f0;
    color: #000000;
    border: 1px solid var(--border);
    padding: 8px 12px;
    border-radius: 6px;
    font-weight: 500;
  }
  
  #live-cat-select option {
    background-color: #ffffff;
    color: #000000;
  }
  
  .loading {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 200px;
    width: 100%;
    color: var(--text-secondary);
    font-size: 1rem;
  }
  
  .spinner {
    width: 50px;
    height: 50px;
    border: 4px solid rgba(229, 9, 20, 0.2);
    border-top-color: var(--primary);
    border-radius: 50%;
    animation: spin 1s linear infinite;
  }
  
  .spinner-small {
    width: 20px;
    height: 20px;
    border: 3px solid rgba(255, 255, 255, 0.3);
    border-top-color: white;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  
  @keyframes spin {
    to { transform: rotate(360deg); }
  }
  
  .footer {
    margin-top: 50px;
    padding-top: 20px;
    border-top: 1px solid var(--border);
    text-align: center;
    color: var(--text-secondary);
    font-size: 0.9rem;
  }
  
  .menu-toggle {
    display: none;
    position: fixed;
    top: 15px;
    left: 15px;
    z-index: 101;
    background: var(--primary);
    border: none;
    border-radius: 5px;
    width: 40px;
    height: 40px;
    justify-content: center;
    align-items: center;

<script>

window.cancelIdleCallback=window.cancelIdleCallback||clearTimeout;

<script>
(function(){
  // Configuração e estado
  let xtreamConfig = { baseUrl: '', user: '', pass: '' };
  let cache = { live: [], vod: {}, series: {}, live_cat: [], vod_cat: [], series_cat: [] };
  let currentHls = null, currentContent = null, selectedQuality = 'auto', liveData = null;
  
  // Controle de lazy loading
  let lazyState = {
    items: [],
    type: '',
    containerId: '',
    currentPage: 0,
    pageSize: 20,
    loading: false,
    hasMore: true,
    observer: null,
    sentinel: null
  };
  
  // Função para extrair servidor, usuário e senha de um link M3U
  function parseM3ULink(m3uLink) {
    try {
      const url = new URL(m3uLink);
      // Obtém o servidor base (protocolo + host + porta se houver)
      const baseUrl = `${url.protocol}//${url.host}`;
      // Extrai parâmetros username e password
      const username = url.searchParams.get('username');
      const password = url.searchParams.get('password');
      if (username && password) {
        return { baseUrl, username, password };
      }
      // Fallback: tentar extrair do path (alguns links M3U têm /user/pass no path)
      const pathParts = url.pathname.split('/');
      if (pathParts.length >= 3) {
        const possibleUser = pathParts[pathParts.length-2];
        const possiblePass = pathParts[pathParts.length-1];
        if (possibleUser && possiblePass && !possibleUser.includes('.') && !possiblePass.includes('.')) {
          return { baseUrl, username: possibleUser, password: possiblePass };
        }
      }
      return null;
    } catch(e) {
      console.error('Erro ao parsear link M3U:', e);
      return null;
    }
  }
  
  // Funções auxiliares
  function isAdultBlocked(text) {
    const blocked = ['adulto','adultos','sex','xxx','hardcore','privado','vip','hot','erotic','redlight','onlyfans','por','sexo','private','brasileirinhas','teste'];
    const lower = (text || '').toLowerCase();
    return blocked.some(k => lower.includes(k));
  }
  
  function filterAdult(items, cats=[]) {
    if (!Array.isArray(items)) return [];
    const catMap = new Map();
    cats.forEach(c => catMap.set(String(c.category_id), (c.category_name||'').toLowerCase()));
    return items.filter(item => {
      if (isAdultBlocked(item.name)) return false;
      const catName = catMap.get(String(item.category_id)) || '';
      return !isAdultBlocked(catName);
    });
  }
  
  function organizeByCategory(list, cats) {
    const result = {};
    if (!cats || !cats.length) { result['outros'] = list; return result; }
    cats.forEach(c => { result[c.category_id] = []; });
    result['outros'] = [];
    list.forEach(item => {
      const cid = item.category_id;
      if (result[cid]) result[cid].push(item);
      else result['outros'].push(item);
    });
    Object.keys(result).forEach(k => { if(result[k].length===0) delete result[k]; });
    return result;
  }
  
  async function fetchAPI(url, useProxy=false) {
    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), 20000);
    try {
      let finalUrl = url;
      if (useProxy) finalUrl = 'https://corsproxy.io/?' + encodeURIComponent(url);
      const res = await fetch(finalUrl, { signal: controller.signal, cache: 'no-store' });
      clearTimeout(timeout);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      return (data === null || (typeof data === 'object' && !Array.isArray(data) && Object.keys(data).length===0)) ? [] : data;
    } catch(e) {
      clearTimeout(timeout);
      throw e;
    }
  }
  
  async function fetchWithFallback(url) {
    try { return await fetchAPI(url, false); } catch(e) {
      console.warn('Direct fetch failed, trying proxy', e);
      return await fetchAPI(url, true);
    }
  }
  
  function getFavorites() { try { return JSON.parse(localStorage.getItem('dwp_favorites') || '[]'); } catch(e){ return []; } }
  function saveFavorites(favs) { localStorage.setItem('dwp_favorites', JSON.stringify(favs)); }
  function addFavorite(item, type) {
    let favs = getFavorites();
    let id = type==='series' ? item.series_id : item.stream_id;
    if(!id) return;
    if(favs.some(f=>f.id==id)) return;
    favs.push({ id, name: item.name, type, poster: item.stream_icon || item.cover || '', added: Date.now() });
    saveFavorites(favs);
  }
  function removeFavorite(id) { saveFavorites(getFavorites().filter(f=>f.id!=id)); }
  function isFavorite(id) { return getFavorites().some(f=>f.id==id); }
  
  // Processamento de canais ao vivo
  function processLiveStreams(streams, cats) {
    const groups = new Map();
    streams.forEach(s => {
      let base = (s.name || '').replace(/\s(SD|HD\+?|FHD|UHD|4K|HEVC|H26[45]|HDR|720P|1080P|\[.*?\])\b/i,'').trim();
      if(!groups.has(base)) groups.set(base, []);
      groups.get(base).push(s);
    });
    const allItems = Array.from(groups.values()).map(group => {
      let sorted = group.sort((a,b)=>b.name.length - a.name.length);
      let rep = sorted[0];
      return { ...rep, name: (rep.name||'').replace(/\s(SD|HD\+?|FHD|UHD|4K|HEVC|H26[45]|HDR|720P|1080P|\[.*?\])\b/i,'').trim(), grouped_streams: sorted };
    });
    const itemsByCat = {};
    allItems.forEach(item => {
      let cid = item.category_id || 'all';
      if(!itemsByCat[cid]) itemsByCat[cid] = [];
      itemsByCat[cid].push(item);
    });
    let catList = (cats || []).filter(c => itemsByCat[c.category_id]);
    if(itemsByCat['all']) catList.push({ category_id: 'all', category_name: 'Outros Canais' });
    catList.sort((a,b)=> (a.category_name||'').localeCompare(b.category_name||''));
    return { categories: catList, itemsByCat };
  }
  
  // Função para buscar informações da série (episódios e temporadas)
  async function fetchSeriesInfo(seriesId) {
    try {
      let url = `${xtreamConfig.baseUrl}/player_api.php?username=${xtreamConfig.user}&password=${xtreamConfig.pass}&action=get_series_info&series_id=${seriesId}`;
      let data = await fetchWithFallback(url);
      if (!data) return null;
      
      let seasons = {};
      if (data.episodes) {
        seasons = data.episodes;
      } else if (data.seasons) {
        seasons = data.seasons;
      }
      
      let seasonsArray = [];
      for (let seasonNum in seasons) {
        if (seasons.hasOwnProperty(seasonNum)) {
          let episodes = seasons[seasonNum];
          if (!Array.isArray(episodes)) episodes = [];
          seasonsArray.push({
            season_number: parseInt(seasonNum),
            episodes: episodes
          });
        }
      }
      seasonsArray.sort((a,b) => a.season_number - b.season_number);
      data.seasons = seasonsArray;
      return data;
    } catch(e) { console.error('Erro info série:', e); return null; }
  }
  
  // Carregamento inicial
  async function fetchInitialData() {
    const { baseUrl, user, pass } = xtreamConfig;
    const base = `${baseUrl}/player_api.php?username=${user}&password=${pass}`;
    const mainEl = document.getElementById('main-content');
    mainEl.innerHTML = '<div class="loading"><div class="spinner"></div></div>';
    try {
      const [live, live_cat, vod_cat, series_cat, vod, series] = await Promise.all([
        fetchWithFallback(`${base}&action=get_live_streams`),
        fetchWithFallback(`${base}&action=get_live_categories`),
        fetchWithFallback(`${base}&action=get_vod_categories`),
        fetchWithFallback(`${base}&action=get_series_categories`),
        fetchWithFallback(`${base}&action=get_vod_streams`),
        fetchWithFallback(`${base}&action=get_series`)
      ]);
      cache.live_cat = filterAdult(Array.isArray(live_cat) ? live_cat : []);
      cache.live = filterAdult(Array.isArray(live) ? live : [], cache.live_cat);
      cache.vod_cat = filterAdult(Array.isArray(vod_cat) ? vod_cat : []);
      let vodRaw = filterAdult(Array.isArray(vod) ? vod : [], cache.vod_cat);
      cache.vod = organizeByCategory(vodRaw, cache.vod_cat);
      cache.series_cat = filterAdult(Array.isArray(series_cat) ? series_cat : []);
      let seriesRaw = filterAdult(Array.isArray(series) ? series : [], cache.series_cat);
      cache.series = organizeByCategory(seriesRaw, cache.series_cat);
      liveData = processLiveStreams(cache.live, cache.live_cat);
      navigateTo('home');
    } catch(err) {
      console.error('Erro carregamento:', err);
      mainEl.innerHTML = '<div class="loading">Erro ao carregar conteúdo. Verifique suas credenciais e tente novamente.</div>';
    }
  }
  
  // Lazy loading
  function setupLazyLoad(containerId, loadMoreFn) {
    cleanupLazyLoad();
    const container = document.getElementById(containerId);
    if (!container) return;
    
    const sentinel = document.createElement('div');
    sentinel.id = 'lazy-sentinel';
    sentinel.style.height = '1px';
    sentinel.style.width = '100%';
    sentinel.style.opacity = '0';
    container.parentNode.appendChild(sentinel);
    
    if(!('IntersectionObserver' in window)){loadMoreFn();return;}\n    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting && lazyState.hasMore && !lazyState.loading) {
          loadMoreFn();
        }
      });
    }, { rootMargin: '200px' });
    
    observer.observe(sentinel);
    lazyState.observer = observer;
    lazyState.sentinel = sentinel;
  }
  
  function cleanupLazyLoad() {
    if (lazyState.observer) {
      lazyState.observer.disconnect();
      lazyState.observer = null;
    }
    if (lazyState.sentinel && lazyState.sentinel.parentNode) {
      lazyState.sentinel.parentNode.removeChild(lazyState.sentinel);
      lazyState.sentinel = null;
    }
  }
  
  function renderLazyGrid(containerId, items, type, reset = true) {
    const container = document.getElementById(containerId);
    if (!container) return;
    
    if (reset) {
      container.innerHTML = '';
      lazyState.items = items;
      lazyState.type = type;
      lazyState.containerId = containerId;
      lazyState.currentPage = 0;
      lazyState.hasMore = items.length > 0;
      lazyState.loading = false;
      cleanupLazyLoad();
    }
    
    function loadMore() {
      if (lazyState.loading || !lazyState.hasMore) return;
      lazyState.loading = true;
      
      const start = lazyState.currentPage * lazyState.pageSize;
      const end = start + lazyState.pageSize;
      const pageItems = lazyState.items.slice(start, end);
      
      if (pageItems.length === 0) {
        lazyState.hasMore = false;
        lazyState.loading = false;
        return;
      }
      
      pageItems.forEach(item => {
        const card = createCard(item, lazyState.type);
        container.appendChild(card);
      });
      
      lazyState.currentPage++;
      lazyState.hasMore = end < lazyState.items.length;
      lazyState.loading = false;
      
      if (!lazyState.hasMore && lazyState.sentinel) {
        lazyState.sentinel.style.display = 'none';
      }
    }
    
    loadMore();
    if (lazyState.hasMore) {
      setupLazyLoad(containerId, loadMore);
    }
  }

  function playMedia(item, type, seasonNum, episode){
    let container=document.getElementById('player-container'); container.style.display='flex';
    let title=item.name||'Sem título';
    if(type==='series' && seasonNum && episode) title+=` - T${seasonNum}E${episode.episode_num||episode.id||''}`;
    document.getElementById('player-title').textContent=title;
    document.getElementById('player-content-title').textContent=title;
    document.getElementById('player-poster').src=item.stream_icon||item.cover||'https://via.placeholder.com/300x450/222/999?text=Sem+Imagem';
    document.getElementById('player-description').textContent=item.plot||item.description||'';
    let metaEl=document.getElementById('player-meta'); metaEl.innerHTML='';
    if(item.releaseDate){ let s=document.createElement('span'); s.textContent=item.releaseDate.split('-')[0]; metaEl.appendChild(s); }
    let tl=document.createElement('span'); tl.textContent=type==='live'?'Ao Vivo':type==='vod'?'Filme':'Série'; metaEl.appendChild(tl);
    
    let { baseUrl, user, pass } = xtreamConfig;
    let streamUrl='';
    if(type==='live') {
      let ext = item.container_extension || 'm3u8';
      streamUrl = `${baseUrl}/live/${user}/${pass}/${item.stream_id}.${ext}`;
    } else if(type==='vod') {
      let ext = item.container_extension || 'mp4';
      streamUrl = `${baseUrl}/movie/${user}/${pass}/${item.stream_id}.${ext}`;
    } else if(type==='series' && episode) {
      let epId = episode.id;
      if (!epId) epId = episode.episode_id;
      let ext = episode.container_extension || 'mp4';
      streamUrl = `${baseUrl}/series/${user}/${pass}/${epId}.${ext}`;
    }
    if(!streamUrl){ document.getElementById('player-media-container').innerHTML='<div class="loading">URL não disponível</div>'; return; }
    
    let mediaContainer=document.getElementById('player-media-container'); mediaContainer.innerHTML='';
    let video=document.createElement('video'); video.id='video-player'; video.controls=true; video.playsinline=true; video.style.width='100%'; video.style.maxHeight='70vh'; video.style.backgroundColor='black'; video.style.borderRadius='8px';
    mediaContainer.appendChild(video);
    
    const isHls = streamUrl.toLowerCase().includes('.m3u8');
    if (isHls && Hls.isSupported()) {
      destroyHls();
      currentHls = new Hls({
        maxBufferLength: 30,
        enableWorker: true,
        manifestLoadingTimeOut: 10000,
        manifestLoadingMaxRetry: 2,
        levelLoadingTimeOut: 10000,
        liveSyncDuration: 10,
        startPosition: -1
      });
      currentHls.loadSource(streamUrl);
      currentHls.attachMedia(video);
      currentHls.on(Hls.Events.MANIFEST_PARSED, () => {
        video.play().catch(err => console.warn('Auto-play bloqueado:', err));
      });
      currentHls.on(Hls.Events.ERROR, (event, data) => {
        if (data.fatal) {
          switch (data.type) {
            case Hls.ErrorTypes.NETWORK_ERROR:
              currentHls.startLoad();
              break;
            case Hls.ErrorTypes.MEDIA_ERROR:
              currentHls.recoverMediaError();
              break;
            default:
              destroyHls();
              break;
          }
        }
      });
      if (selectedQuality !== 'auto') {
        currentHls.on(Hls.Events.MANIFEST_PARSED, (ev, data) => {
          let levels = data.levels;
          let idx = -1;
          if (selectedQuality === '1080p') idx = levels.findIndex(l => l.height >= 1080);
          else if (selectedQuality === '720p') idx = levels.findIndex(l => l.height >= 720);
          else if (selectedQuality === '480p') idx = levels.findIndex(l => l.height >= 480);
          else if (selectedQuality === '360p') idx = levels.findIndex(l => l.height >= 360);
          if (idx !== -1) currentHls.currentLevel = idx;
        });
      }
    } else if (video.canPlayType('application/vnd.apple.mpegurl') && isHls) {
      video.src = streamUrl;
      video.addEventListener('loadedmetadata', () => video.play().catch(() => {}), { once: true });
    } else {
      video.src = streamUrl;
      video.addEventListener('loadedmetadata', () => video.play().catch(() => {}), { once: true });
    }
    
    currentContent={item,type,season:seasonNum,episode};
    let epSection=document.getElementById('player-episodes');
    if(type==='series' && seasonNum && episode){ epSection.style.display='block'; loadPlayerEpisodes(item,seasonNum,episode); }
    else epSection.style.display='none';
    updatePlayerFavoriteBtn();
  }

      let list=document.getElementById('player-episodes-list'); list.innerHTML='';

      if(!season||!season.episodes||!season.episodes.length){ list.innerHTML='<div class="loading">Nenhum episódio</div>'; return; }

    sel.onchange=()=>renderEps(sel.value);
    renderEps(currentSeason);
  }

  function openQualityModal(){
    let modal=document.getElementById('quality-modal'); let opts=document.getElementById('quality-options'); opts.innerHTML='';
    let qualities=[{id:'auto',name:'Automático',res:'Detectar'},{id:'1080p',name:'Full HD',res:'1920x1080'},{id:'720p',name:'HD',res:'1280x720'},{id:'480p',name:'SD',res:'854x480'},{id:'360p',name:'Baixa',res:'640x360'}];
    qualities.forEach(q=>{
      let el=document.createElement('div'); el.className='quality-option'; if(q.id===selectedQuality) el.style.background='rgba(229,9,20,0.3)';
      el.innerHTML=`<div class="quality-name">${q.name}</div><div class="quality-resolution">${q.res}</div>`;
      el.addEventListener('click',()=>{ selectedQuality=q.id; modal.style.display='none'; if(currentContent) playMedia(currentContent.item,currentContent.type,currentContent.season,currentContent.episode); });
      opts.appendChild(el);
    });
    modal.style.display='flex';
  }
  
  // Login
  function showLoginError(msg){ let el=document.getElementById('login-error'); el.textContent=msg; el.style.display='block'; }
  function hideLoginError(){ document.getElementById('login-error').style.display='none'; }
  function handleLogin(e){
    e.preventDefault();
    let name = document.getElementById('login-name').value.trim();
    let url = document.getElementById('login-url').value.trim();
    let username = document.getElementById('login-username').value.trim();
    let password = document.getElementById('login-password').value.trim();
    let m3uLink = document.getElementById('login-m3u').value.trim();
    
    // Se o campo M3U foi preenchido, prioriza ele
    if (m3uLink) {
      const parsed = parseM3ULink(m3uLink);
      if (!parsed) {
        showLoginError('Link M3U inválido. Não foi possível extrair servidor, usuário e senha.');
        return;
      }
      url = parsed.baseUrl;
      username = parsed.username;
      password = parsed.password;
    }
    
    if (!url || !username || !password) {
      showLoginError('Preencha os campos de servidor/usuário/senha OU forneça um link M3U válido.');
      return;
    }
    
    if (!url.startsWith('http://') && !url.startsWith('https://')) {
      showLoginError('A URL deve começar com http:// ou https://');
      return;
    }
    
    hideLoginError();
    let btn = document.getElementById('login-btn');
    btn.disabled = true;
    btn.innerHTML = '<div class="spinner-small"></div> Conectando...';
    
    let cleanUrl = url.endsWith('/') ? url.slice(0, -1) : url;
    let testUrl = `${cleanUrl}/player_api.php?username=${username}&password=${password}`;
    
    fetchWithFallback(testUrl).then(data => {
      if (!data.user_info) throw new Error('Resposta inválida');
      loginSuccess(cleanUrl, username, password, name, data.user_info);
    }).catch(err => {
      console.error('Login error:', err);
      showLoginError('Não foi possível conectar. Verifique os dados fornecidos.');
      btn.disabled = false;
      btn.textContent = 'Entrar';
    });
  }
  
  function loginSuccess(url, user, pass, name, userInfo){
    xtreamConfig={baseUrl:url,user:user,pass:pass};
    let displayName=name||userInfo.username||'Usuário';
    let expiry=userInfo.exp_date?new Date(userInfo.exp_date*1000).toLocaleDateString('pt-BR'):'--/--/----';
    localStorage.setItem('dwp_credentials',JSON.stringify({apiUrl:url,username:user,password:pass,name:displayName,expiry:expiry}));
    document.getElementById('login-container').style.display='none';
    document.getElementById('app-content').style.display='flex';
    document.getElementById('user-name').textContent=displayName;
    document.getElementById('user-expiry').textContent='Expira: '+expiry;
    fetchInitialData();
  }
  function tryAutoLogin(){
    let saved=localStorage.getItem('dwp_credentials');
    if(!saved) return false;
    try{
      let c=JSON.parse(saved);
      if(!c.apiUrl||!c.username||!c.password) return false;
      xtreamConfig={baseUrl:c.apiUrl,user:c.username,pass:c.password};
      document.getElementById('login-container').style.display='none';
      document.getElementById('app-content').style.display='flex';
      document.getElementById('user-name').textContent=c.name||'Usuário';
      document.getElementById('user-expiry').textContent='Expira: '+(c.expiry||'--/--/----');
      fetchInitialData();
      return true;
    }catch(e){ return false; }
  }
  function logout(){ destroyPlayer(); localStorage.removeItem('dwp_credentials'); document.getElementById('app-content').style.display='none'; document.getElementById('login-container').style.display='flex'; document.getElementById('login-form').reset(); document.getElementById('login-btn').disabled=false; document.getElementById('login-btn').textContent='Entrar'; hideLoginError(); cache={live:[],vod:{},series:{},live_cat:[],vod_cat:[],series_cat:[]}; liveData=null; cleanupLazyLoad(); }
  
  // Eventos
  document.addEventListener('DOMContentLoaded',()=>{
    document.getElementById('login-form').addEventListener('submit',handleLogin);
    document.getElementById('sidebar').addEventListener('click',e=>{
      let menuItem=e.target.closest('.menu-item[data-page]');
      if(menuItem){ navigateTo(menuItem.dataset.page); return; }
      if(e.target.closest('#menu-logout')) logout();
    });
    document.getElementById('menu-toggle').addEventListener('click',()=>document.getElementById('sidebar').classList.toggle('open'));
    document.getElementById('player-close-btn').addEventListener('click',destroyPlayer);
    document.getElementById('player-stop-btn').addEventListener('click',destroyPlayer);
    document.getElementById('player-quality-btn').addEventListener('click',openQualityModal);
    document.getElementById('player-favorite-btn').addEventListener('click',function(){ if(!currentContent) return; let id=currentContent.type==='series'?currentContent.item.series_id:currentContent.item.stream_id; if(isFavorite(id)) removeFavorite(id); else addFavorite(currentContent.item,currentContent.type); updatePlayerFavoriteBtn(); });
    document.getElementById('close-modal').addEventListener('click',()=>document.getElementById('content-details-modal').style.display='none');
    document.getElementById('close-series-modal').addEventListener('click',()=>document.getElementById('series-episodes-modal').style.display='none');
    document.getElementById('close-quality-modal').addEventListener('click',()=>document.getElementById('quality-modal').style.display='none');
    window.addEventListener('click',e=>{ if(e.target.id==='content-details-modal') e.target.style.display='none'; if(e.target.id==='series-episodes-modal') e.target.style.display='none'; if(e.target.id==='quality-modal') e.target.style.display='none'; });
    document.getElementById('main-content').addEventListener('click',()=>document.getElementById('sidebar').classList.remove('open'));
    if(!tryAutoLogin()){ document.getElementById('login-container').style.display='flex'; document.getElementById('app-content').style.display='none'; }
  });
})();
</script>
</body>
